<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gram2Profit</title>
    <style>
        body { background: #0f1923; color: white; font-family: sans-serif; padding: 16px; }
        input, button { width: 100%; padding: 12px; margin: 6px 0; border-radius: 8px; border: none; font-size: 16px; }
        button { background: #00d2ff; color: white; font-weight: bold; cursor: pointer; }
        .preview { background: #1a2733; padding: 12px; border-radius: 12px; margin: 12px 0; }
    </style>
</head>
<body>
    <h3>💎 Gram2Profit</h3>
    <input type="text" id="collectionInput" placeholder="Коллекция">
    <input type="number" id="buyAmount" placeholder="Куплено (GRAM)" step="0.0001">
    <input type="number" id="sellAmount" placeholder="Продано (GRAM)" step="0.0001">
    <input type="number" id="royalty" placeholder="Комиссия (GRAM)" value="0.3" step="0.01">
    <div class="preview">
        Прибыль: <span id="profitGram">0 GRAM</span> | USD: <span id="profitUsd">$0.00</span>
    </div>
    <button id="addSaleBtn">➕ Добавить сделку</button>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let gramPrice = 2.5;
        fetch('https://api.coingecko.com/api/v3/simple/price?ids=the-open-network&vs_currencies=usd')
            .then(r => r.json())
            .then(d => { gramPrice = d['the-open-network'].usd; });

        function calculate() {
            const buy = parseFloat(document.getElementById('buyAmount').value) || 0;
            const sell = parseFloat(document.getElementById('sellAmount').value) || 0;
            const royalty = parseFloat(document.getElementById('royalty').value) || 0;
            const profit = sell - buy - royalty;
            document.getElementById('profitGram').textContent = (profit >= 0 ? '+' : '') + profit.toFixed(4) + ' GRAM';
            document.getElementById('profitUsd').textContent = '$' + (profit * gramPrice).toFixed(2);
        }

        ['buyAmount','sellAmount','royalty'].forEach(id => {
            document.getElementById(id).addEventListener('input', calculate);
        });

        document.getElementById('addSaleBtn').addEventListener('click', () => {
            const coll = document.getElementById('collectionInput').value.trim();
            const buy = document.getElementById('buyAmount').value;
            const sell = document.getElementById('sellAmount').value;
            if (!coll || !buy || !sell) {
                tg.showAlert('Заполните все поля');
                return;
            }
            const data = {
                action: 'add_sale',
                category: coll,
                buy_amount: buy,
                sell_amount: sell,
                royalty: document.getElementById('royalty').value || 0.3,
                profit_gram: (parseFloat(sell) - parseFloat(buy) - parseFloat(document.getElementById('royalty').value || 0)).toFixed(4)
            };
            tg.sendData(JSON.stringify(data));
            tg.showAlert('✅ Сделка отправлена боту!');
            document.getElementById('collectionInput').value = '';
            document.getElementById('buyAmount').value = '';
            document.getElementById('sellAmount').value = '';
            document.getElementById('profitGram').textContent = '0 GRAM';
            document.getElementById('profitUsd').textContent = '$0.00';
        });
    </script>
</body>
</html>
